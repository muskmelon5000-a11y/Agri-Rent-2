<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html, #map {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: #FAFAFA;
        }
        .user-pulse-dot {
            width: 16px;
            height: 16px;
            background-color: #2563EB;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.6);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map', {
            zoomControl: false
        }).setView([23.0225, 72.5714], 13); // Center on location

        // Tile Layers (Streets, Hybrid Satellite, Terrain)
        var tileLayers = {
            streets: L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '&copy; Google Maps' }),
            hybrid: L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '&copy; Google Maps' }),
            terrain: L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', { maxZoom: 20, attribution: '&copy; Google Maps' })
        };
        var currentLayer = tileLayers.streets.addTo(map);

        function setMapLayer(layerName) {
            if (tileLayers[layerName]) {
                map.removeLayer(currentLayer);
                currentLayer = tileLayers[layerName].addTo(map);
            }
        }

        // Custom Equipment Pin
        var greenIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Search Location Elements
        var searchCircle = null;
        var searchMarker = null;
        var userPulseMarker = null;

        var markersGroup = L.layerGroup().addTo(map);
        var markersMap = {};

        function centerMap(lat, lng, zoomLevel) {
            var zoom = zoomLevel || 14;
            map.flyTo([lat, lng], zoom, { animate: true, duration: 1.2 });
            
            // Update search marker
            if (searchMarker) {
                searchMarker.setLatLng([lat, lng]);
            } else {
                searchMarker = L.marker([lat, lng]).addTo(map).bindPopup("📍 Search Location");
            }

            // Update search radius circle (20km)
            if (searchCircle) {
                searchCircle.setLatLng([lat, lng]);
            } else {
                searchCircle = L.circle([lat, lng], {
                    radius: 20000,
                    color: '#059669',
                    fillColor: '#10B981',
                    fillOpacity: 0.12,
                    weight: 2
                }).addTo(map);
            }
        }

        function setUserLocation(lat, lng) {
            var userIcon = L.divIcon({
                className: 'user-pulse-dot',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
            if (userPulseMarker) {
                userPulseMarker.setLatLng([lat, lng]);
            } else {
                userPulseMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map).bindPopup("📍 My Real GPS Location");
            }
            centerMap(lat, lng, 15);
        }

        function setMarkers(equipmentJson) {
            markersGroup.clearLayers();
            markersMap = {};

            var equipments = JSON.parse(equipmentJson);
            equipments.forEach(function(eq) {
                if (eq.latitude && eq.longitude) {
                    var marker = L.marker([eq.latitude, eq.longitude], { icon: greenIcon })
                        .bindPopup("<b>" + eq.name + "</b><br>₹" + eq.price_per_day + "/day");
                    
                    marker.on('click', function() {
                        if (window.AndroidBridge) {
                            window.AndroidBridge.onMarkerSelected(eq.id);
                        }
                    });

                    markersGroup.addLayer(marker);
                    markersMap[eq.id] = marker;
                }
            });
        }

        function focusMarker(eqId) {
            var marker = markersMap[eqId];
            if (marker) {
                marker.openPopup();
                map.panTo(marker.getLatLng());
            }
        }

        map.on('moveend', function() {
            var center = map.getCenter();
            if (window.AndroidBridge) {
                window.AndroidBridge.onMapMoved(center.lat, center.lng);
            }
        });
    </script>
</body>
</html>
