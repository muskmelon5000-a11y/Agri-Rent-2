<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html, #map {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map', {
            zoomControl: false
        }).setView([23.0225, 72.5714], 12); // Default Ahmedabad/Anandpur center

        // Base Layer
        var baseLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '&copy; Google Maps'
        }).addTo(map);

        // Custom Equipment Icon matching website green pin
        var greenIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Search Location Circle
        var searchCircle = null;
        var searchMarker = null;

        var markersGroup = L.layerGroup().addTo(map);
        var markersMap = {};

        function centerMap(lat, lng) {
            map.flyTo([lat, lng], 13);
            
            // Update search marker
            if (searchMarker) {
                searchMarker.setLatLng([lat, lng]);
            } else {
                searchMarker = L.marker([lat, lng]).addTo(map).bindPopup("📍 Search Center");
            }

            // Update search circle
            if (searchCircle) {
                searchCircle.setLatLng([lat, lng]);
            } else {
                searchCircle = L.circle([lat, lng], {
                    radius: 20000, // 20km
                    color: '#059669',
                    fillColor: '#10B981',
                    fillOpacity: 0.15,
                    weight: 2
                }).addTo(map);
            }
        }

        // JavaScript interface function called from Android
        function setMarkers(equipmentJson) {
            markersGroup.clearLayers();
            markersMap = {};

            var equipments = JSON.parse(equipmentJson);
            equipments.forEach(function(eq) {
                if (eq.latitude && eq.longitude) {
                    var marker = L.marker([eq.latitude, eq.longitude], { icon: greenIcon })
                        .bindPopup("<b>" + eq.name + "</b><br>₹" + eq.price_per_day + "/day");
                    
                    marker.on('click', function() {
                        // Notify Android about marker selection
                        if (window.AndroidBridge) {
                            window.AndroidBridge.onMarkerSelected(eq.id);
                        }
                    });

                    markersGroup.addLayer(marker);
                    markersMap[eq.id] = marker;
                }
            });
        }

        function focusMarker(eqId) {
            var marker = markersMap[eqId];
            if (marker) {
                marker.openPopup();
                map.panTo(marker.getLatLng());
            }
        }

        // Send map move events to Android to trigger "Search this area"
        map.on('moveend', function() {
            var center = map.getCenter();
            if (window.AndroidBridge) {
                window.AndroidBridge.onMapMoved(center.lat, center.lng);
            }
        });
    </script>
</body>
</html>
