name: Keep Backend Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render's 15-minute inactivity sleep
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          echo "Pinging backend to keep it awake..."
          curl -s https://agrirent-backend-v5xi.onrender.com/health
          echo "Ping complete."
