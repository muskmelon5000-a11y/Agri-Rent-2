services:
  - type: web
    name: agrirent-backend-blueprint
    env: python
    repo: https://github.com/sainikhilobili/AgriRent
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
